<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>onlymuse: design plan</title>
<style>
  :root {
    --page: #0c0c0e;
    --win: #1b1b1e;
    --side: #232327;
    --line: #2e2e33;
    --card: #2a2a2f;
    --hover: #34343a;
    --text: #f2f2f4;
    --dim: #9b9ba3;
    --faint: #6b6b73;
    /* The accent is the main hue of the playing cover. Amulet's sky gives this lavender. */
    --accent: #a98be6;
    --accent-tint: rgba(169, 139, 230, .2);
    --yt: #ff4e45;
    --yt-tint: rgba(255, 78, 69, .14);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  .page { width: 1320px; margin: 0 auto; padding: 56px 0 120px; }
  h1 { font-size: 40px; letter-spacing: -0.02em; margin: 0 0 6px; }
  h2 { font-size: 26px; letter-spacing: -0.01em; margin: 72px 0 6px; }
  h3 { font-size: 17px; margin: 28px 0 8px; }
  .lead { color: var(--dim); font-size: 16px; max-width: 860px; margin: 0; }
  .note { color: var(--dim); max-width: 900px; margin: 6px 0 22px; }
  .note b, .lead b { color: var(--text); }
  .toc { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 0; }
  .toc a { color: var(--text); text-decoration: none; background: var(--card); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
  .toc a:hover { background: var(--hover); }
  .toc a.yt { background: var(--yt-tint); color: #ffb3ae; }
  img { display: block; }
  .part { margin: 110px 0 0; padding: 28px 0 0; border-top: 2px solid var(--line); }
  .part .kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--faint); }
  .part.yt { border-top-color: var(--yt); }
  .part.yt .kicker { color: var(--yt); }
  .part h2 { margin-top: 4px; font-size: 32px; }

  /* The window */
  .window { position: relative; width: 1240px; height: 780px; background: var(--win); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
  .upper { flex: 1; display: flex; min-height: 0; }
  .sidebar { width: 210px; flex: none; background: #202024; padding: 14px 8px; display: flex; flex-direction: column; gap: 1px; overflow: hidden; }
  .lights { display: flex; gap: 8px; padding: 2px 8px 14px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .search { display: flex; align-items: center; gap: 7px; background: rgba(255,255,255,.07); border-radius: 8px; padding: 6px 9px; color: var(--faint); font-size: 13px; margin: 0 0 10px; }
  .search.active { color: var(--text); box-shadow: 0 0 0 2px var(--accent); }
  .group { color: var(--faint); font-size: 11px; font-weight: 600; padding: 12px 10px 4px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 7px; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item svg { flex: none; color: var(--accent); }
  .item.on { background: rgba(255,255,255,.09); }
  .item.yt svg { color: var(--yt); }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .navrow { height: 40px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 22px; color: var(--dim); }
  .content { flex: 1; overflow: hidden; padding: 4px 22px 22px; min-width: 0; position: relative; }
  .panel { width: 290px; flex: none; background: #1f1f23; padding: 10px 8px 8px; display: flex; flex-direction: column; overflow: hidden; }
  .panel .list { flex: 1; overflow: hidden; }
  .panel .tabs { display: flex; background: rgba(255,255,255,.05); border-radius: 8px; padding: 2px; flex: none; margin-top: 8px; }
  .panel .tabs span { flex: 1; display: flex; gap: 6px; align-items: center; justify-content: center; font-size: 12.5px; padding: 6px; border-radius: 6px; color: var(--text); }
  .panel .tabs span svg { color: var(--dim); }
  .panel .tabs span.on { background: var(--accent-tint); color: var(--accent); }
  .panel .tabs span.on svg { color: var(--accent); }
  .p-head { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--dim); padding: 2px 6px 8px; }
  .p-head .rules { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--text); background: rgba(255,255,255,.08); padding: 2px 8px; border-radius: 6px; }
  .p-head svg { color: var(--accent); }
  .q-item { display: flex; align-items: center; gap: 10px; padding: 5px 6px; border-radius: 7px; }
  .q-item img, .q-item .thumb { width: 36px; height: 36px; border-radius: 4px; flex: none; object-fit: cover; }
  .q-item .x { min-width: 0; flex: 1; }
  .q-item .n { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .q-item .d { font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-item.now { background: var(--accent-tint); }
  .q-item.now .n { color: var(--accent); }

  .player { height: 70px; flex: none; display: grid; grid-template-columns: 1fr 1.1fr 1fr; align-items: center; gap: 20px; padding: 0 14px; background: #1d1d21; border-top: 1px solid var(--line); }
  .np { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .np img, .np .blank { width: 50px; height: 50px; border-radius: 6px; flex: none; }
  .np .blank { background: #34343a; display: grid; place-items: center; color: var(--faint); }
  .np .x { min-width: 0; }
  .np .t { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .np .s { font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .center { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .transport { display: flex; align-items: center; gap: 22px; color: var(--text); }
  .transport .big { width: 34px; height: 34px; border-radius: 50%; background: var(--text); color: #111; display: grid; place-items: center; }
  .progress { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .progress .track { flex: 1; height: 4px; border-radius: 2px; background: #3a3a40; }
  .progress .track i { display: block; height: 100%; border-radius: 2px; background: var(--text); }
  .right { display: flex; align-items: center; justify-content: flex-end; gap: 14px; color: var(--dim); }
  .vol { width: 80px; height: 4px; background: #44444b; border-radius: 2px; }
  .vol i { display: block; width: 50%; height: 100%; background: var(--text); border-radius: 2px; }
  .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 9.5px; font-weight: 700; letter-spacing: .02em; color: var(--dim); border: 1px solid #5a5a62; border-radius: 4px; padding: 0 4px; line-height: 14px; white-space: nowrap; }
  .badge.green { color: #7ee2a8; border-color: #3f7d5a; }
  .badge.yt { color: #ffb3ae; border-color: #8a3a35; }
  .heart { color: var(--faint); flex: none; display: inline-grid; }
  .heart.on { color: var(--accent); }

  /* Content pieces */
  .h-page { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 12px; }
  .shelf { margin-bottom: 22px; }
  .shelf-title { font-size: 17px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .shelf-title .more { color: var(--faint); font-weight: 400; }
  .shelf-title .sub { color: var(--dim); font-weight: 400; font-size: 12.5px; margin-left: 4px; }
  .row { display: flex; gap: 14px; overflow: hidden; }
  .tile { width: 150px; flex: none; }
  .tile img, .tile .ph { width: 150px; height: 150px; border-radius: 6px; object-fit: cover; background: var(--card); }
  .tile.big, .tile.big img { width: 180px; }
  .tile.big img { height: 180px; }
  .tile .n { font-size: 12.5px; margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .d { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { display: inline-flex; align-items: center; gap: 7px; background: var(--accent); color: white; font-weight: 600; font-size: 13px; padding: 7px 16px; border-radius: 8px; white-space: nowrap; }
  .btn.ghost { background: rgba(255,255,255,.1); color: var(--text); }
  .btn.small { font-size: 12px; padding: 5px 11px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text); background: rgba(255,255,255,.08); border-radius: 999px; padding: 4px 11px; white-space: nowrap; }
  .pill.acc { color: var(--accent); background: var(--accent-tint); }
  .pill.yt { color: #ffb3ae; background: var(--yt-tint); }
  .songs { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; }
  .song { display: flex; align-items: center; gap: 11px; padding: 6px 4px; min-width: 0; }
  .song img, .song .thumb { width: 40px; height: 40px; border-radius: 4px; flex: none; object-fit: cover; }
  .song .x { flex: 1; min-width: 0; }
  .song .n { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .song .d { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .time { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; width: 34px; text-align: right; flex: none; }
  .song .date { color: var(--dim); font-size: 12px; white-space: nowrap; flex: none; }
  .tracks .tr { display: grid; grid-template-columns: 34px 1fr 24px 50px; align-items: center; padding: 9px 10px; border-radius: 7px; font-size: 13px; }
  .tracks .tr .num { color: var(--faint); font-variant-numeric: tabular-nums; }
  .tracks .tr .time { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
  .tracks .tr.playing { background: var(--accent-tint); }
  .tracks .tr.playing .num, .tracks .tr.playing .name { color: var(--accent); font-weight: 600; }

  .lyrics { padding: 8px 8px; }
  .lyrics .l { margin: 0 0 16px; font-size: 17px; font-weight: 700; color: #4d4d55; line-height: 1.3; }
  .lyrics .l.past { color: #3a3a41; }
  .lyrics .l.cur { color: var(--text); font-size: 19px; }
  .lyrics .l .ro { display: block; font-size: 12.5px; font-weight: 500; color: inherit; opacity: .75; margin-top: 2px; }
  .lyrics .l .tl { display: block; font-size: 12.5px; font-weight: 500; color: var(--dim); margin-top: 2px; }
  .lyrics .l .bar { display: block; height: 12px; border-radius: 6px; background: currentColor; opacity: .55; }

  .menu { background: #2a2a30; border-radius: 10px; padding: 5px; box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.09); font-size: 13px; width: 260px; }
  .menu .mi { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 9px; border-radius: 6px; }
  .menu .mi span:last-child { color: var(--dim); font-size: 12px; }
  .menu .mi.on { background: var(--accent); color: white; }
  .menu .mi.on span:last-child { color: rgba(255,255,255,.8); }
  .menu .mt { font-weight: 700; padding: 8px 9px 6px; }
  .menu hr { border: 0; border-top: 1px solid rgba(255,255,255,.08); margin: 4px 6px; }

  .palette { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); width: 540px; background: rgba(40,40,46,.97); border-radius: 12px; padding: 8px; box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.1); z-index: 8; }
  .palette .field { display: flex; align-items: center; gap: 9px; border: 1px solid #55555c; border-radius: 8px; padding: 9px 11px; font-size: 15px; }
  .palette .gt { font-size: 11px; font-weight: 700; color: var(--dim); padding: 10px 10px 4px; }
  .palette .pi { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; font-size: 13.5px; }
  .palette .pi.on { background: var(--accent-tint); }
  .palette .pi .k { margin-left: auto; color: var(--dim); font-size: 12px; }
  .palette .pi .hint { color: var(--dim); font-size: 12px; }
  .palette .pi svg { color: var(--dim); flex: none; }
  .palette .pi.on svg { color: var(--accent); }

  .toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); background: #303036; border-radius: 9px; padding: 8px 14px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); white-space: nowrap; }

  /* YouTube pieces */
  .vid { position: relative; width: 220px; flex: none; }
  .vid .pic { width: 220px; height: 124px; border-radius: 6px; background-size: cover; background-position: center; position: relative; overflow: hidden; }
  .vid .pic::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.55)); }
  .vid .len { position: absolute; right: 6px; bottom: 6px; z-index: 1; font-size: 11px; font-weight: 600; background: rgba(0,0,0,.75); border-radius: 4px; padding: 0 5px; }
  .vid .kind { position: absolute; left: 6px; bottom: 6px; z-index: 1; font-size: 10.5px; font-weight: 700; color: white; }
  .vid .n { font-size: 12.5px; margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vid .d { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ytmark { display: inline-grid; place-items: center; width: 16px; height: 11px; border-radius: 3px; background: var(--yt); flex: none; }
  .ytmark::before { content: ""; border-left: 5px solid white; border-top: 3px solid transparent; border-bottom: 3px solid transparent; margin-left: 1px; }
  .thumb.yt { position: relative; background-size: cover; background-position: center; }
  .match { font-size: 11px; color: var(--dim); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .match.ok { color: #7ee2a8; }
  .match.warn { color: #ffd479; }
  .match.yt { color: #ffb3ae; }

  /* Annotations */
  .callout { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #ffd60a; color: #111; font-weight: 800; font-size: 13px; display: grid; place-items: center; box-shadow: 0 0 0 4px rgba(255,214,10,.25); z-index: 9; }
  .legend { counter-reset: n; margin: 0; padding: 0; list-style: none; }
  .legend li { position: relative; padding-left: 38px; margin-bottom: 14px; color: var(--dim); }
  .legend li b { color: var(--text); display: block; }
  .legend li::before { counter-increment: n; content: counter(n); position: absolute; left: 0; top: 1px; width: 24px; height: 24px; border-radius: 50%; background: #ffd60a; color: #111; font-weight: 800; font-size: 12px; display: grid; place-items: center; }
  .screen { margin: 20px 0 10px; position: relative; }
  .caption { color: var(--dim); max-width: 1000px; margin: 12px 0 0; }
  .caption b { color: var(--text); }

  /* States */
  .states { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .state { background: var(--win); border-radius: 12px; padding: 18px; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
  .state p { color: var(--dim); font-size: 13px; margin: 12px 0 0; }
  .state h4 { margin: 0; font-size: 14px; }
  .state .player { grid-template-columns: 1fr; margin-top: 12px; border-radius: 8px; border: none; }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #55555c; border-top-color: var(--text); display: inline-block; }
  .sheet-wrap { position: relative; height: 150px; margin-top: 12px; border-radius: 8px; background: #26262b; overflow: hidden; }
  .sheet { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 230px; background: #f5f5f7; color: #1d1d1f; border-radius: 0 0 10px 10px; padding: 12px 14px; box-shadow: 0 12px 30px rgba(0,0,0,.5); font-size: 12px; text-align: center; }
  .sheet .field { background: white; border: 1px solid #d2d2d7; border-radius: 6px; padding: 5px 8px; text-align: left; color: #86868b; margin: 6px 0; }
  .sheet .go { background: #0071e3; color: white; border-radius: 6px; padding: 5px; font-weight: 600; }

  /* Stage */
  .stage-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(60px) saturate(1.2); opacity: .35; transform: scale(1.2); }
  .stage { position: relative; }
  .stats { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 10px; margin: 18px 0 14px; }
  .stat { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 10px 12px; }
  .stat .k { font-size: 10.5px; font-weight: 700; color: var(--dim); letter-spacing: .04em; }
  .stat .v { font-size: 22px; font-weight: 700; }
  .stat .s { font-size: 11.5px; color: var(--dim); }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .facts .stat div.f { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
  .facts .stat div.f span:first-child { color: var(--dim); }

  /* Tech plan */
  .arch { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; margin-top: 18px; }
  .box { background: #17171a; border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .box h4 { margin: 0 0 4px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .box .sub { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  .box .layer { background: #202024; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-top: 8px; font-size: 13px; }
  .box .layer b { display: block; }
  .box .layer span { color: var(--dim); }
  .box .layer.new { border-color: #8a3a35; background: #241a1b; }
  .tag2 { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; }
  .od { background: #1e3a5f; color: #8cc4ff; }
  .sw { background: #4a2a17; color: #ffb27a; }
  .ext { background: #2e2e33; color: var(--dim); }
  .ytt { background: #4a1c1a; color: #ffb3ae; }
  .link { text-align: center; color: var(--faint); font-size: 12px; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13.5px; }
  th { text-align: left; color: var(--faint); font-weight: 600; font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:first-child { color: var(--dim); width: 170px; }
  td code, p code, li code, span code { font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; background: #222227; padding: 1px 5px; border-radius: 4px; }
  .flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 14px; }
  .flow div { background: #17171a; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 13px; }
  .flow div b { display: block; margin-bottom: 4px; }
  .flow div span { color: var(--dim); }
  .flow div em { display: block; font-style: normal; color: #ffd60a; font-size: 12px; margin-top: 6px; }
  .phases { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 14px; }
  .phase { background: #17171a; border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .phase b { display: block; margin-bottom: 6px; }
  .phase ul { margin: 0; padding-left: 18px; color: var(--dim); font-size: 13px; }
  .phase .done { color: #7ee2a8; font-size: 12px; margin: 8px 0 0; }
  .phase .todo { color: var(--faint); font-size: 12px; margin: 8px 0 0; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .cols ul { color: var(--dim); padding-left: 18px; }
  .cols li { margin-bottom: 6px; }
  .cols li b { color: var(--text); }
  .ideas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 14px; }
  .idea { background: #17171a; border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-size: 13px; color: var(--dim); }
  .idea b { color: var(--text); display: block; font-size: 14px; margin-bottom: 4px; }
  .idea .why { color: var(--text); margin-top: 8px; font-size: 12.5px; }
  .idea .tag2 { float: right; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
</style>
</head>
<body>
<div class="page" id="page"></div>
<script src="data.js"></script>
<script>
const D = window.DATA
const time = (ms) => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` }
const esc = (s = '') => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const sized = (url, size) => url.replace(/\d+x\d+(bb|cc)/, `${size}x${size}$1`)

const icons = {
  home: '<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
  grid: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',

// ---------- The window ----------

function sidebar(active, { searchText, youtube } = {}) {
  const item = (key, icon, label, cls = '') => `<div class="item ${cls} ${active === key ? 'on' : ''}">${ic(icon)}${esc(label)}</div>`
  const playlists = D.playlists.filter((p) => p !== 'Favourite Songs').slice(0, youtube ? 6 : 9)
  return `<div class="sidebar">
    <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="search ${searchText ? 'active' : ''}">${ic('search', 14)}${searchText ? esc(searchText) : 'Search'}</div>
    <div class="group">Apple Music</div>
    ${item('home', 'home', 'Home')}${item('new', 'grid', 'New')}
    ${youtube ? `<div class="group">YouTube Music</div>${item('mixes', 'radio', 'Mixes for You', 'yt')}${item('ytliked', 'heartOff', 'Liked on YouTube', 'yt')}` : ''}
    <div class="group">Library</div>
    ${item('favourites', 'star', 'Favourite Songs')}${item('recent', 'clock', 'Recently Added')}${item('artists', 'mic', 'Artists')}${item('albums', 'stack', 'Albums')}${item('songs', 'note', 'Songs')}${item('downloaded', 'down', 'Downloaded')}
    <div class="group">Playlists</div>
    ${playlists.map((p) => item('pl-' + p, 'list', p)).join('')}
  </div>`
}

function nowPlaying(p = playingIf, state = 'playing') {
  if (state === 'stopped') return `<div class="np"><div class="blank">${ic('note', 20)}</div><div class="x"><div class="t">Not playing</div></div></div>`
  const sub = state === 'adding'
    ? `<div class="s" style="display:flex;align-items:center;gap:6px"><span class="spin"></span>Adding to your library…</div>`
    : `<div class="s">${esc(p.sub)}</div>`
  return `<div class="np"><img src="${p.art}"><div class="x"><div class="t">${esc(p.name)} ${p.badge ?? ''} ${heart(p.fav, 15)}</div>${sub}</div></div>`
}

function playerBar(p = playingIf) {
  return `<div class="player">
    ${nowPlaying(p)}
    <div class="center">
      <div class="transport"><span style="color:var(--accent)">${ic('shuffle', 16)}</span>${ic('prev', 20)}<span class="big">${ic('pause', 15)}</span>${ic('next', 20)}<span style="color:var(--dim)">${ic('repeat', 16)}</span></div>
      <div class="progress"><span>${time(p.dur * p.progress)}</span><div class="track"><i style="width:${p.progress * 100}%"></i></div><span>${time(p.dur)}</span></div>
    </div>
    <div class="right">${ic('sidebarRight', 18)}${ic('vol', 17)}<div class="vol"><i></i></div></div>
  </div>`
}

function windowFrame({ active = null, content, panel, searchText, playing, overlay = '', youtube = false }) {
  return `<div class="window"><div class="upper">${sidebar(active, { searchText, youtube })}<div class="main">
    <div class="navrow">${ic('back')}${ic('fwd')}</div>
    <div class="content">${content}</div>${overlay}</div>${panel ? panelHtml(panel) : ''}</div>${playerBar(playing)}</div>`
}

function panelTabs(on) {
  return `<div class="tabs"><span class="${on === 'queue' ? 'on' : ''}">${ic('bullets', 14)}Up Next</span><span class="${on === 'lyrics' ? 'on' : ''}">${ic('quote', 14)}Lyrics</span></div>`
}

const queueRow = (s, extra = '') => `<div class="q-item ${extra}">${s.thumb ?? `<img src="${s.art}">`}<div class="x"><div class="n">${s.mark ?? ''}${esc(s.name)}</div><div class="d">${esc(s.artist)}</div></div>${s.right ?? ''}</div>`

function panelHtml(kind) {
  if (typeof kind === 'object') return `<div class="panel"><div class="list">${kind.html}</div>${panelTabs(kind.tab)}</div>`
  if (kind === 'lyrics') {
    // Grey bars stand in for real lines. The line playing shows its romaji and translation under it.
    const bars = (w, cls) => `<div class="l ${cls}"><span class="bar" style="width:${w}%"></span></div>`
    return `<div class="panel"><div class="list lyrics">
      ${bars(70, 'past')}${bars(55, 'past')}${bars(82, 'past')}
      <div class="l cur">the line being sung lights up<span class="ro">its romaji, under it</span><span class="tl">and its English translation</span></div>
      ${bars(60, '')}${bars(76, '')}${bars(48, '')}${bars(70, '')}${bars(62, '')}${bars(40, '')}
    </div>${panelTabs('lyrics')}</div>`
  }
  const art = amuletArt(120)
  const after = amulet.tracks.filter((t) => t.n > ifTrack.n)
  return `<div class="panel"><div class="p-head">${ic('shuffle', 12)}Shuffled. Recent songs go last.<span class="rules">Rules</span></div><div class="list">
    ${queueRow({ name: 'If', artist: "SHE'S", art }, 'now')}
    ${after.map((t) => queueRow({ name: t.name, artist: "SHE'S", art })).join('')}
    ${D.artist.top.filter((t) => !amulet.tracks.some((a) => a.name === t.name)).slice(0, 4).map((t) => queueRow({ name: t.name, artist: "SHE'S", art: t.art })).join('')}
  </div>${panelTabs('queue')}</div>`
}

const tile = (t, cls = '') => `<div class="tile ${cls}"><img src="${t.art || t.photo}"><div class="n">${esc(t.name)}</div>${t.sub !== undefined || t.year ? `<div class="d">${esc(t.sub ?? t.year)}</div>` : ''}</div>`
const shelf = (title, inner, more = true, sub = '') => `<div class="shelf"><div class="shelf-title">${esc(title)}${more ? ' <span class="more">›</span>' : ''}${sub ? `<span class="sub">${sub}</span>` : ''}</div>${inner}</div>`
const songRow = (s, { date, sub } = {}) => `<div class="song">${s.thumb ?? `<img src="${s.art}">`}<div class="x"><div class="n">${s.mark ?? ''}${esc(s.name)}${s.badge ?? ''}</div><div class="d">${sub ?? esc(s.album ?? s.artist)}</div></div>${date ? `<span class="date">${esc(date)}</span>` : ''}${s.right ?? heart(isFav(s.name))}<span class="time">${time(s.dur)}</span></div>`

const topSongs = D.artist.top
const ytOnly = [
  { name: 'Letter (Live at Zepp)', sub: "SHE'S · live video · 2023", kind: 'LIVE', len: '5:02', art: topSongs[0].art, tint: '#ff4e45' },
  { name: 'Spell On Me (Acoustic Session)', sub: "SHE'S · studio session", kind: 'ACOUSTIC', len: '3:48', art: topSongs[1].art, tint: '#e0a14a' },

  { name: 'Cloud 9 (Demo, 2015)', sub: "SHE'S · official upload", kind: 'UNRELEASED', len: '3:40', art: topSongs[2].art, tint: '#5fc28e' },
]
const vid = (v) => `<div class="vid"><div class="pic" style="${ytPic(v.art, v.tint)}"><span class="kind">${v.kind}</span><span class="len">${v.len}</span></div><div class="n">${esc(v.name)}</div><div class="d">${esc(v.sub)}</div></div>`

const ytMark = '<span class="ytmark"></span>'
const ytBadge = '<span class="badge yt">YOUTUBE · AAC 256</span>'

function ytOnlyShelf() {

function ytSearchContent() {

  </div>

  <h3 id="yt-search">Search with a fallback</h3>
  <p class="note">Apple's results, unchanged. A song both have shows "also on YouTube", and its YouTube copy is hidden. <b>From YouTube</b> lists only what Apple has no match for, each with a red mark.</p>
  <div class="screen">${windowFrame({ content: ytSearchContent(), searchText: "she's", panel: 'queue', youtube: true })}</div>

  <h3 id="yt-artist">Only on YouTube, on the artist page</h3>
  <p class="note">A shelf under Albums, in YouTube's 16:9 thumbnails, so it reads as video at a glance. A thumbnail's corner says what kind of upload it is.</p>
  <div class="screen">${windowFrame({ content: artistContentScrolled(ytOnlyShelf()), panel: 'queue', youtube: true })}</div>
  <p class="caption">YouTube's own artist channel gives the official uploads. Covers come from a search on the song names, and only those with many views are shown, to keep out noise.</p>

  <h3 id="yt-radio">Radio and a queue with two sources</h3>
  <p class="note">"Start Radio" in the song menu asks YouTube Music for the song's radio, then finds each song in Apple's catalog. The line above Up Next says how many play lossless. <b>Sources</b> sets which source is used when.</p>
  <div class="screen">${windowFrame({ content: albumContent(), panel: radioPanel(), playing: matchedPlaying, youtube: true })}</div>
  <div class="split" style="margin-top:22px">
    <div><h3>When a YouTube song plays</h3><p class="note">The badge says where the sound comes from, and in what quality. The volume and the queue work as for Apple songs.</p>
      <div class="state" style="padding:0;overflow:hidden">${playerBar(ytPlaying)}</div>
      <p class="caption" style="margin-top:14px">If Apple later has the song, Stage and the song's menu offer <b>Play the Lossless Version</b>.</p></div>
    <div><h3>Sources</h3><p class="note">Above Up Next, beside Rules. The first line can't be turned off.</p>${sourceRulesMenu()}</div>
  </div>

  <h3 id="yt-mixes">Mixes for You</h3>
  <p class="note">A YouTube Music group in the sidebar holds YouTube's mixes and your likes there. Each mix says how many of its songs play in lossless.</p>
  <div class="screen">${windowFrame({ active: 'mixes', content: mixesContent(), panel: 'queue', youtube: true })}</div>

  <h3 id="yt-import">Bring over your playlists</h3>
  <p class="note">A page you open from the palette ("Bring Over from YouTube Music"). Green songs found an Apple match and play lossless. Red ones play from YouTube. Yellow ones need you to pick between close matches.</p>
  <div class="screen">${windowFrame({ content: importContent(), panel: 'queue', youtube: true })}</div>

  <h3>Matching a YouTube song to Apple</h3>
  <div class="flow">
    <div><b>1. Read</b><span>YouTube gives the title, artist, album and length. A "song" in YouTube Music is the label's own audio, so it usually matches.</span><em>with the radio or search</em></div>
    <div><b>2. Clean</b><span>Strip "(Official Video)", "【MV】", "TV Size" and similar, but remember them.</span><em>at once</em></div>
    <div><b>3. Search Apple</b><span><code>/v1/catalog/{sf}/search?types=songs</code> with the clean title and artist.</span><em>~0.3 s, then saved</em></div>
    <div><b>4. Compare</b><span>Same artist, same title once cleaned, length within 3 s. Close but not exact means "to check".</span><em>at once</em></div>
    <div><b>5. Keep</b><span>Each answer is saved, YouTube ID to Apple ID, so a song is matched once.</span><em>a new table, <code>matches</code></em></div>
  </div>

  <h3>How it fits the app</h3>
  <div class="arch">
    <div class="box"><h4>onlymuse, with YouTube</h4><div class="sub">New parts in red</div>
      <div class="layer"><b><span class="tag2 od">Odin</span> &nbsp;build/onlymuse</b>
        <div class="layer new"><b>src/youtube</b><span>The one package that asks YouTube Music, as <code>src/apple</code> is for Apple. Search, artist, radio, mixes, library. Saved in the same <code>responses</code> table</span></div>
        <div class="layer new"><b>src/app/match.odin</b><span>The steps above, and the <code>matches</code> table</span></div>
        <div class="layer"><b>Queue</b><span>Each song names its source. At a hand-off between sources, the queue tells the right player to start</span></div>
      </div>
      <div class="link">⇅ JSON lines, two new messages: <code>youtube-play</code>, <code>youtube-state</code></div>
      <div class="layer"><b><span class="tag2 sw">Swift</span> &nbsp;onlymuse-helper</b>
        <div class="layer"><b>Music.app</b><span>As now</span></div>
        <div class="layer new"><b>YouTube web view</b><span>A hidden web view on music.youtube.com, like the Apple one. It holds your sign-in, makes YouTube's own requests from inside the page, and plays YouTube songs with the page's own player, audio only</span></div>
      </div>
    </div>
    <div class="box"><h4>Why play through the web page</h4><div class="sub">Three ways to play a YouTube song</div>
      <div class="layer"><b>The page's own player <span class="pill acc" style="margin-left:6px">Proposed</span></b><span>The same pattern as the Apple tokens. Premium's quality, no ads with Premium, nothing downloaded, and YouTube sees normal plays, so its mixes keep learning.</span></div>
      <div class="layer"><b>Download the audio and play it in Music.app</b><span>Would go through goui's EQ, but breaks YouTube's terms and fills the library with files. No.</span></div>
      <div class="layer"><b>Open the song in a browser</b><span>No code, but the queue stops at the hand-off. Only as a last resort.</span></div>
    </div>
  </div>

  <h3>Build order</h3>
  <div class="phases">
    <div class="phase"><b>1. Find</b><ul><li>YouTube web view and sign-in</li><li>Search with a fallback</li><li>Only on YouTube</li><li>Matching and <code>matches</code></li></ul><p class="todo">Opens videos in the browser for now</p></div>
    <div class="phase"><b>2. Radio</b><ul><li>Start Radio in the song menu</li><li>Mixes for You</li><li>Only songs Apple has, so all play lossless</li></ul><p class="todo">Already worth having alone</p></div>
    <div class="phase"><b>3. Play from YouTube</b><ul><li>The web view's player</li><li>Two sources in one queue</li><li>The YOUTUBE badge, Sources</li><li>Play the Lossless Version</li></ul><p class="todo">The biggest step</p></div>
    <div class="phase"><b>4. Bring over</b><ul><li>Playlists with a match report</li><li>Likes to Favourite Songs</li><li>Lyrics when Apple has none</li><li>Later: the video on Stage</li></ul><p class="todo">One-off, then kept in step</p></div>
  </div>

  <h3>Risks and questions for you</h3>
  <div class="cols">
    <ul>
      <li><b>YouTube's API is unofficial.</b> The web page's requests can change without notice, as Apple's tokens could. Keeping all of it in the web view and <code>src/youtube</code> limits what breaks.</li>
      <li><b>goui's EQ</b> is set up for Music.app. A YouTube song plays from the helper, so it may not be EQ'd unless goui works on all of the Mac's output.</li>
      <li><b>No gapless hand-off</b> between the two sources. A YouTube song mostly sits between unrelated songs, as in a radio, so this matters little.</li>
      <li><b>Wrong matches.</b> A remaster, a TV-size edit or a re-recording can pass as the same song. Unsure matches ask you, and any match can be undone from the song's menu.</li>
    </ul>
    <ul>
      <li><b>Do you have YouTube Music Premium?</b> Without it, YouTube songs come with ads and lower quality, and step 3 is worth less. Steps 1, 2 and 4 work either way.</li>
      <li><b>Does goui EQ the whole Mac,</b> or only Music.app?</li>
      <li><b>Should a favourite be liked on YouTube too?</b> It helps YouTube's mixes, but it writes to your YouTube account.</li>
      <li><b>Videos:</b> keep them as songs only, or bring in idea 10, the video on Stage?</li>
    </ul>
  </div>
`
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>onlymuse: design plan</title>
<style>
  :root {
    --page: #0c0c0e;
    --win: #1b1b1e;
    --side: #232327;
    --line: #2e2e33;
    --card: #2a2a2f;
    --hover: #34343a;
    --text: #f2f2f4;
    --dim: #9b9ba3;
    --faint: #6b6b73;
    /* The system accent colour. The app reads it from macOS. Yours is purple. */
    --accent: #a550a7;
    --accent-tint: rgba(165, 80, 167, .18);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  .page { width: 1320px; margin: 0 auto; padding: 56px 0 120px; }
  h1 { font-size: 40px; letter-spacing: -0.02em; margin: 0 0 6px; }
  h2 { font-size: 26px; letter-spacing: -0.01em; margin: 72px 0 6px; }
  h3 { font-size: 17px; margin: 28px 0 8px; }
  .lead { color: var(--dim); font-size: 16px; max-width: 860px; margin: 0; }
  .note { color: var(--dim); max-width: 900px; margin: 6px 0 22px; }
  .toc { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 0; }
  .toc a { color: var(--text); text-decoration: none; background: var(--card); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
  .toc a:hover { background: var(--hover); }
  img { display: block; }

  /* The window */
  .window { position: relative; width: 1240px; height: 780px; background: var(--win); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
  .upper { flex: 1; display: flex; min-height: 0; }
  .toolbar { height: 52px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 22px; color: var(--dim); }
  .toolbar span { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; background: rgba(255,255,255,.05); }
  .player { height: 80px; flex: none; display: grid; grid-template-columns: 1fr 1.25fr 1fr; align-items: center; gap: 20px; padding: 0 20px; border-top: 1px solid var(--line); background: #1f1f23; }
  .np { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .np img, .np .blank { width: 52px; height: 52px; border-radius: 6px; flex: none; }
  .np .blank { background: #34343a; display: grid; place-items: center; color: var(--faint); }
  .np .x { min-width: 0; }
  .np .t { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .np .s { font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np .s a { color: var(--text); text-decoration: none; }
  .np .like { color: var(--accent); margin-left: 4px; }
  .center { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .center .transport { gap: 22px; }
  .center .big { width: 34px; height: 34px; border-radius: 50%; background: var(--text); color: #111; display: grid; place-items: center; }
  .progress { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .progress .track { flex: 1; height: 4px; border-radius: 2px; background: #3a3a40; }
  .progress .track i { display: block; height: 100%; border-radius: 2px; background: var(--text); }
  .player .right { justify-content: flex-end; }
  .item.fav svg { color: var(--accent); fill: var(--accent); }
  .sidebar { width: 228px; flex: none; background: linear-gradient(180deg, #26262b, #202024); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .lights { display: flex; gap: 8px; padding: 2px 6px 16px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .search { display: flex; align-items: center; gap: 7px; background: rgba(255,255,255,.07); border-radius: 8px; padding: 6px 9px; color: var(--faint); font-size: 13px; margin: 0 2px 12px; }
  .search.active { color: var(--text); box-shadow: 0 0 0 2px var(--accent); }
  .group { color: var(--faint); font-size: 11px; font-weight: 600; padding: 12px 10px 4px; }
  .item { display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: 7px; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item svg { flex: none; color: var(--accent); }
  .item.on { background: rgba(255,255,255,.1); }
  .item.plain { color: var(--dim); padding-left: 12px; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 64px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 18px; border-bottom: 1px solid var(--line); }
  .nav { display: flex; gap: 4px; color: var(--dim); }
  .nav span { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; }
  .transport { display: flex; align-items: center; gap: 16px; color: var(--text); }
  .transport .big { width: 30px; height: 30px; }
  .lcd { flex: 1; max-width: 520px; height: 46px; margin: 0 auto; background: #29292e; border-radius: 8px; display: flex; align-items: center; overflow: hidden; border: 1px solid #36363c; }
  .lcd img, .lcd .blank { width: 46px; height: 46px; flex: none; }
  .lcd .blank { background: #34343a; display: grid; place-items: center; color: var(--faint); }
  .lcd .meta { flex: 1; min-width: 0; text-align: center; padding: 0 10px; position: relative; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .lcd .t { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .lcd .s { font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lcd .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #3a3a40; }
  .lcd .bar i { display: block; height: 100%; background: #c9c9cf; }
  .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 9.5px; font-weight: 700; letter-spacing: .02em; color: var(--dim); border: 1px solid #4a4a52; border-radius: 4px; padding: 0 4px; line-height: 14px; }
  .right { display: flex; align-items: center; gap: 12px; color: var(--dim); }
  .right .on { color: var(--accent); }
  .vol { width: 70px; height: 3px; background: #44444b; border-radius: 2px; }
  .vol i { display: block; width: 60%; height: 100%; background: #c9c9cf; border-radius: 2px; }
  .body { flex: 1; display: flex; min-height: 0; }
  .content { flex: 1; overflow: hidden; padding: 26px 30px; min-width: 0; }
  .panel { width: 300px; flex: none; border-left: 1px solid var(--line); background: #1f1f23; padding: 16px; overflow: hidden; }
  .panel .tabs { display: flex; background: rgba(255,255,255,.06); border-radius: 7px; padding: 2px; margin-bottom: 14px; }
  .panel .tabs span { flex: 1; text-align: center; font-size: 12px; padding: 4px; border-radius: 5px; color: var(--dim); }
  .panel .tabs span.on { background: #3a3a40; color: var(--text); }

  /* Content pieces */
  .h-page { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 18px; }
  .shelf { margin-bottom: 24px; }
  .shelf-title { font-size: 17px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .shelf-title .more { color: var(--faint); font-weight: 400; }
  .row { display: flex; gap: 16px; overflow: hidden; }
  .tile { width: 150px; flex: none; }
  .tile img, .tile .ph { width: 150px; height: 150px; border-radius: 8px; object-fit: cover; background: var(--card); box-shadow: 0 0 0 1px rgba(255,255,255,.06); }
  .tile.big, .tile.big img { width: 210px; }
  .tile.big img { height: 210px; }
  .tile .n { font-size: 12.5px; margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .d { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .round img { border-radius: 50%; }
  .round .n { text-align: center; }
  .btn { display: inline-flex; align-items: center; gap: 7px; background: var(--accent); color: white; font-weight: 600; font-size: 13px; padding: 7px 16px; border-radius: 8px; }
  .btn.ghost { background: rgba(255,255,255,.12); color: var(--text); }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--dim); background: rgba(255,255,255,.07); border-radius: 999px; padding: 4px 10px; }
  .pill.ok { color: #7ee2a8; background: rgba(126,226,168,.1); }
  .songs { display: grid; grid-template-columns: 1fr 1fr; column-gap: 26px; }
  .song { display: flex; align-items: center; gap: 11px; padding: 6px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .song img { width: 40px; height: 40px; border-radius: 5px; flex: none; }
  .song .x { flex: 1; min-width: 0; }
  .song .n { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .d { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .time { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .dots { color: var(--faint); letter-spacing: 1px; text-align: right; }

  .tracks .tr { display: grid; grid-template-columns: 34px 1fr 90px 60px 36px; align-items: center; padding: 9px 10px; border-radius: 7px; font-size: 13px; }
  .tracks .tr:nth-child(odd) { background: rgba(255,255,255,.03); }
  .tracks .tr .num { color: var(--faint); font-variant-numeric: tabular-nums; }
  .tracks .tr .time { color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; }
  .tracks .tr.playing { background: var(--accent-tint); }
  .tracks .tr.playing .num, .tracks .tr.playing .name { color: var(--accent); font-weight: 600; }
  .tracks .tr .tag { font-size: 11px; color: var(--faint); }

  .q-item { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 6px; }
  .q-item img { width: 36px; height: 36px; border-radius: 4px; }
  .q-item .n { font-size: 12.5px; }
  .q-item .d { font-size: 11.5px; color: var(--dim); }
  .q-item.now { background: var(--accent-tint); }
  .q-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--faint); font-weight: 600; margin: 12px 4px 6px; }
  .q-head .toggles { display: flex; gap: 6px; }
  .q-head .toggles span { padding: 2px 7px; border-radius: 5px; background: rgba(255,255,255,.06); color: var(--dim); font-weight: 500; }
  .q-head .toggles span.on { color: var(--accent); background: var(--accent-tint); }
  .grip { color: var(--faint); margin-left: auto; font-size: 12px; }

  .lyrics { padding: 6px 2px; }
  .lyrics .l { height: 13px; border-radius: 6px; background: #303036; margin: 15px 0; }
  .lyrics .l.cur { background: none; height: auto; font-size: 19px; font-weight: 700; line-height: 1.3; }
  .lyrics .l.cur b { color: var(--text); }
  .lyrics .l.cur span { color: #55555c; }

  .tabs-row { display: flex; gap: 6px; margin: 0 0 20px; }
  .tabs-row span { font-size: 13px; padding: 5px 14px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--dim); }
  .tabs-row span.on { background: var(--text); color: #111; font-weight: 600; }

  /* Annotations */
  .annotated { display: flex; gap: 28px; align-items: flex-start; }
  .callout { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #ffd60a; color: #111; font-weight: 800; font-size: 13px; display: grid; place-items: center; box-shadow: 0 0 0 4px rgba(255,214,10,.25); z-index: 5; }
  .legend { counter-reset: n; margin: 0; padding: 0; list-style: none; }
  .legend li { position: relative; padding-left: 38px; margin-bottom: 14px; color: var(--dim); }
  .legend li b { color: var(--text); display: block; }
  .legend li::before { counter-increment: n; content: counter(n); position: absolute; left: 0; top: 1px; width: 24px; height: 24px; border-radius: 50%; background: #ffd60a; color: #111; font-weight: 800; font-size: 12px; display: grid; place-items: center; }
  .screen { margin: 20px 0 10px; }
  .caption { color: var(--dim); max-width: 1000px; margin: 12px 0 0; }
  .caption b { color: var(--text); }

  /* States */
  .states { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .state { background: var(--win); border-radius: 12px; padding: 18px; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
  .state .lcd { max-width: none; margin: 12px 0 0; }
  .state p { color: var(--dim); font-size: 13px; margin: 12px 0 0; }
  .state h4 { margin: 0; font-size: 14px; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #55555c; border-top-color: var(--text); display: inline-block; }
  .sheet-wrap { position: relative; height: 150px; margin-top: 12px; border-radius: 8px; background: #26262b; overflow: hidden; }
  .sheet-wrap::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, #2c2c31 0 60px, #26262b 60px 64px); opacity: .6; }
  .sheet { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 230px; background: #f5f5f7; color: #1d1d1f; border-radius: 0 0 10px 10px; padding: 12px 14px; box-shadow: 0 12px 30px rgba(0,0,0,.5); font-size: 12px; text-align: center; }
  .sheet .field { background: white; border: 1px solid #d2d2d7; border-radius: 6px; padding: 5px 8px; text-align: left; color: #86868b; margin: 6px 0; }
  .sheet .go { background: #0071e3; color: white; border-radius: 6px; padding: 5px; font-weight: 600; }

  /* Tech plan */
  .arch { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; margin-top: 18px; }
  .box { background: #17171a; border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .box h4 { margin: 0 0 4px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .box .sub { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  .box .layer { background: #202024; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-top: 8px; font-size: 13px; }
  .box .layer b { display: block; }
  .box .layer span { color: var(--dim); }
  .tag2 { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; }
  .ts { background: #1e3a5f; color: #8cc4ff; }
  .sw { background: #4a2a17; color: #ffb27a; }
  .ext { background: #2e2e33; color: var(--dim); }
  .link { text-align: center; color: var(--faint); font-size: 12px; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13.5px; }
  th { text-align: left; color: var(--faint); font-weight: 600; font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:first-child { color: var(--dim); width: 170px; }
  td code, p code, li code { font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; background: #222227; padding: 1px 5px; border-radius: 4px; }
  .flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 14px; }
  .flow div { background: #17171a; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 13px; }
  .flow div b { display: block; margin-bottom: 4px; }
  .flow div span { color: var(--dim); }
  .flow div em { display: block; font-style: normal; color: #ffd60a; font-size: 12px; margin-top: 6px; }
  .phases { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 14px; }
  .phase { background: #17171a; border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .phase b { display: block; margin-bottom: 6px; }
  .phase ul { margin: 0; padding-left: 18px; color: var(--dim); font-size: 13px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .cols ul { color: var(--dim); padding-left: 18px; }
  .cols li { margin-bottom: 6px; }
  .cols li b { color: var(--text); }
</style>
</head>
<body>
<div class="page" id="page"></div>
<script src="data.js"></script>
<script>
const D = window.DATA
const $ = (html) => html
const time = (ms) => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` }
const esc = (s = '') => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

const icons = {
  home: '<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
  new: '<path d="M12 3l2.4 5.6L20 11l-5.6 2.4L12 19l-2.4-5.6L4 11l5.6-2.4z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  album: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="12" r="3"/>',
  note: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  down: '<circle cx="12" cy="12" r="9"/><path d="M12 7v9M8 12l4 4 4-4"/>',
  list: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  play: '<path d="M7 4v16l13-8z" fill="currentColor" stroke="none"/>',
  pause: '<rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/>',
  prev: '<path d="M11 6v12L3 12zM21 6v12l-8-6z" fill="currentColor" stroke="none"/>',
  next: '<path d="M3 6v12l8-6zM13 6v12l8-6z" fill="currentColor" stroke="none"/>',
  shuffle: '<path d="M3 7h3c4 0 6 10 10 10h4M3 17h3c1.6 0 2.8-1.6 3.9-3.5M14 9.5C15 8 16.1 7 18 7h2M18 4l3 3-3 3M18 14l3 3-3 3"/>',
  repeat: '<path d="M4 11V9a3 3 0 0 1 3-3h13M17 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H4M7 21l-3-3 3-3"/>',
  queue: '<path d="M4 6h12M4 12h12M4 18h8M18 15v6l4-3z"/>',
  lyrics: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
  vol: '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/>',
  back: '<path d="m15 5-7 7 7 7"/>',
  fwd: '<path d="m9 5 7 7-7 7"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="m5 12 5 5 9-10"/>',
  more: '<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>',
}
const ic = (name, size = 16) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${icons[name]}</svg>`

const amulet = D.album
const ifTrack = amulet.tracks.find((t) => t.name === 'If')
const playing = { name: 'If', artist: "SHE'S", album: 'Amulet', art: amulet.art.replace('800x800', '120x120'), progress: 0.35 }

function sidebar(active, searchText) {
  const item = (key, icon, label) => `<div class="item ${active === key ? 'on' : ''}">${ic(icon)}${label}</div>`
  const favourite = `<div class="item fav ${active === 'favourites' ? 'on' : ''}"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg>Favourite Songs</div>`
  const playlists = D.playlists.filter((p) => p !== 'Favourite Songs').slice(0, 8)
  return `<div class="sidebar">
    <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="search ${searchText ? 'active' : ''}">${ic('search', 14)}${searchText ? esc(searchText) : 'Search'}</div>
    <div class="group">Apple Music</div>
    ${item('home', 'home', 'Home')}${item('new', 'new', 'New')}
    <div class="group">Library</div>
    ${favourite}${item('recent', 'clock', 'Recently Added')}${item('artists', 'mic', 'Artists')}${item('albums', 'album', 'Albums')}${item('songs', 'note', 'Songs')}${item('downloaded', 'down', 'Downloaded')}
    <div class="group">Playlists</div>
    ${playlists.map((p) => `<div class="item plain">${ic('list', 14)}${esc(p)}</div>`).join('')}
  </div>`
}

function nowPlaying(state = 'playing') {
  if (state === 'stopped') return `<div class="np"><div class="blank">${ic('note', 20)}</div><div class="x"><div class="t" style="color:var(--dim)">Not playing</div><div class="s">Music.app is closed</div></div></div>`
  const sub = state === 'adding'
    ? `<div class="s" style="display:flex;align-items:center;gap:6px"><span class="spin"></span>Adding to library…</div>`
    : `<div class="s"><a>${playing.artist}</a> — ${playing.album}</div>`
  return `<div class="np"><img src="${playing.art}"><div class="x">
    <div class="t">${playing.name}${state === 'playing' ? ' <span class="badge">LOSSLESS</span>' : ''}</div>${sub}</div></div>`
}

function playerBar(panel) {
  const elapsedMs = ifTrack.dur * playing.progress
  return `<div class="player">
    ${nowPlaying()}
    <div class="center">
      <div class="transport"><span style="color:var(--dim)">${ic('shuffle', 15)}</span>${ic('prev', 18)}<span class="big">${ic('pause', 16)}</span>${ic('next', 18)}<span style="color:var(--accent)">${ic('repeat', 15)}</span></div>
      <div class="progress"><span>${time(elapsedMs)}</span><div class="track"><i style="width:${playing.progress * 100}%"></i></div><span>${time(ifTrack.dur)}</span></div>
    </div>
    <div class="right"><span class="${panel === 'lyrics' ? 'on' : ''}">${ic('lyrics', 17)}</span><span class="${panel === 'queue' ? 'on' : ''}">${ic('queue', 17)}</span>${ic('vol', 16)}<div class="vol"><i></i></div></div>
  </div>`
}

function windowFrame({ active, content, panel, searchText, id }) {
  return `<div class="window" ${id ? `id="${id}"` : ''}><div class="upper">${sidebar(active, searchText)}<div class="main">
    <div class="toolbar"><span>${ic('back')}</span><span>${ic('fwd')}</span></div>
    <div class="body"><div class="content">${content}</div>${panel ? panelHtml(panel) : ''}</div></div></div>${playerBar(panel)}</div>`
}

function panelHtml(kind) {
  if (kind === 'lyrics') {
    const lines = [0.7, 0.55, 0.8, 'cur', 0.6, 0.75, 0.5, 0.7, 0.65, 0.4, 0.72, 0.58]
    return `<div class="panel"><div class="tabs"><span>Up Next</span><span class="on">Lyrics</span></div><div class="lyrics">
      ${lines.map((w) => w === 'cur'
        ? `<div class="l cur"><b>the line being sung</b> <span>lights up word by word</span></div>`
        : `<div class="l" style="width:${w * 100}%"></div>`).join('')}
      <div style="color:var(--faint);font-size:11.5px;margin-top:18px">Grey bars stand in for lyric lines in this mockup.</div></div></div>`
  }
  const art = amulet.art.replace('800x800', '120x120')
  const after = amulet.tracks.filter((t) => t.n > ifTrack.n)
  const before = amulet.tracks.filter((t) => t.n < ifTrack.n).slice(-2)
  const row = (t, extra = '') => `<div class="q-item ${extra}"><img src="${art}"><div><div class="n">${esc(t.name)}</div><div class="d">SHE'S</div></div><span class="grip">${extra ? '' : '≡'}</span></div>`
  return `<div class="panel"><div class="tabs"><span class="on">Up Next</span><span>Lyrics</span></div>
    <div class="q-head"><span>History</span></div>${before.map((t) => row(t)).join('').replaceAll('<div class="q-item ', '<div style="opacity:.45" class="q-item ')}
    <div class="q-head"><span>Now playing</span></div>${row(ifTrack, 'now')}
    <div class="q-head"><span>Up next · from Amulet</span><span class="toggles"><span>Shuffle</span><span class="on">Repeat</span></span></div>
    ${after.map((t) => row(t)).join('')}</div>`
}

const tile = (t, cls = '') => `<div class="tile ${cls}"><img src="${t.art || t.photo}"><div class="n">${esc(t.name)}</div>${t.sub !== undefined || t.year ? `<div class="d">${esc(t.sub ?? t.year)}</div>` : ''}</div>`

function homeContent() {
  // onlymuse has no page for a station, so a station shelf stays off Home.
  const [made, ...rest] = D.home.filter((shelf) => shelf.title !== 'Stations for You')
  return `<div class="h-page">Home</div>
    <div class="shelf"><div class="shelf-title">${esc(made.title)} <span class="more">›</span></div><div class="row">${made.items.map((t) => tile(t, 'big')).join('')}</div></div>
    ${rest.slice(0, 3).map((s) => `<div class="shelf"><div class="shelf-title">${esc(s.title)} <span class="more">›</span></div><div class="row">${s.items.map((t) => tile(t)).join('')}</div></div>`).join('')}`
}

function artistContent() {
  const a = D.artist
  return `<div style="margin:-26px -30px 22px;height:300px;position:relative;background:#${a.bg}">
      <img src="${a.photo}" style="width:100%;height:100%;object-fit:cover;object-position:center 30%">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(27,27,30,.95) 100%)"></div>

    <div style="display:grid;grid-template-columns:230px 1fr;gap:28px;margin-bottom:24px">

      <div><div class="shelf-title">Top Songs <span class="more">›</span></div><div class="songs">${a.top.map((s) => `<div class="song"><img src="${s.art}"><div class="x"><div class="n">${esc(s.name)}</div><div class="d">${esc(s.album)}</div></div><span class="time">${time(s.dur)}</span><span class="dots">···</span></div>`).join('')}</div></div>

}

function albumContent() {
  const al = D.album
  return `<div style="display:flex;gap:28px;align-items:flex-end;margin-bottom:22px">
      <img src="${al.art.replace('800x800', '500x500')}" style="width:240px;height:240px;border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.5)">

        <div style="font-size:32px;font-weight:800;letter-spacing:-0.02em">${esc(al.name)}</div>
        <div style="font-size:20px;color:var(--accent);font-weight:600;margin:2px 0 6px">${esc(al.artist)}</div>
        <div style="color:var(--dim);font-size:13px;margin-bottom:14px">${esc(al.genre)} · ${al.year} · ${al.tracks.length} songs</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
          <span class="badge" style="font-size:11px;padding:1px 6px">LOSSLESS</span><span class="badge" style="font-size:11px;padding:1px 6px">DOLBY ATMOS</span>

function searchContent() {
  const s = D.search
